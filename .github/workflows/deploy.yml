name: Deploy

on:
  # push:
  #   branches:
  #     - master
  #   paths:
  #     - src/**
  #     - Dockerfile
  #     - entrypoint.sh
  #     - pyproject.toml
  #     - uv.lock
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASS }}
          script: |
            set -e

            cd ${{ secrets.SERVER_PROJECT_PATH }}/infra

            if [ ! -f .env ]; then
              echo "ERROR: Required file .env does not exist in $(pwd)"
              exit 1
            fi

            docker compose pull
            if docker compose up -d --wait --wait-timeout 120; then
              echo "Application is ready; database migrations completed."
            else
              deploy_status=$?
              echo "ERROR: Deployment failed: a service exited, became unhealthy, or did not become ready within 120 seconds."
              echo "=== App startup logs (including Alembic errors) ==="
              docker compose logs --no-color app || true
              echo "=== Container status ==="
              docker compose ps --all || true
              exit "$deploy_status"
            fi
            docker system prune -f

            echo "=== Container status ==="
            docker compose ps

            echo "=== App logs (last 30 lines) ==="
            docker compose logs app --tail=30
