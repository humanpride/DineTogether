name: sytle_check

on:
  pull_request:
    branches:
      - dev
      - master

jobs:
  check_style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set-up python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Install dependies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.15.12

      - name: Test style
        run: python -m ruff check ./src
