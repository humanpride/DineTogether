name: sytle_check

on:
  pull_request:
    branches:
      - dev
      - master
  workflow_dispatch:

jobs:
  check_style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set-up python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.12

      - name: Install dependies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Test style
        run: python -m ruff check ./src
